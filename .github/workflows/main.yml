name: Better Tomorrow AAB 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'BetterTomorrow_International_Live_V3.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi

          rm -rf .build_source
          mkdir -p .build_source

          unzip -o "$ZIP_FILE" -d .build_source
          cp -a .build_source/. .

      - name: Set Version Code to 2
        shell: bash
        run: |
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode 2/" app/build.gradle
          echo "Version Code:"
          grep -n "versionCode" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release AAB
        shell: bash
        run: |
          gradle --no-daemon clean bundleRelease

      - name: Find release AAB
        shell: bash
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          if [ -z "$AAB_FILE" ]; then
            echo "Release AAB not found"
            exit 1
          fi

          echo "AAB_FILE=$AAB_FILE" >> "$GITHUB_ENV"
          ls -lh "$AAB_FILE"

      - name: Decode upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_JSON: ${{ secrets.ANDROID_KEYSTORE_JSON }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_JSON" > signing.json

          jq empty signing.json

          KEYSTORE_BASE64=$(jq -r '.keystore_base64' signing.json)
          STORE_PASSWORD=$(jq -r '.store_password' signing.json)
          KEY_ALIAS=$(jq -r '.key_alias' signing.json)
          KEY_PASSWORD=$(jq -r '.key_password' signing.json)

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-upload-key.jks

          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Sign release AAB
        shell: bash
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore android-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

      - name: Verify signed AAB
        shell: bash
        run: |
          jarsigner -verify -verbose -certs "$AAB_FILE"
          echo "SIGNED AAB VERIFIED"

      - name: Rename final AAB
        shell: bash
        run: |
          cp "$AAB_FILE" BetterTomorrow-release-v2.aab
          ls -lh BetterTomorrow-release-v2.aab

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-release-v2
          path: BetterTomorrow-release-v2.aab
          if-no-files-found: error
