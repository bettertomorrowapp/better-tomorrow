
name: Better Tomorrow Android Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract latest project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'BetterTomorrow_International_Live_V3.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "BetterTomorrow_International_Live_V3.zip not found"
            exit 1
          fi
          rm -rf .build_source
          mkdir -p .build_source
          unzip -o "$ZIP_FILE" -d .build_source
          cp -a .build_source/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release AAB
        run: gradle --no-daemon clean bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
