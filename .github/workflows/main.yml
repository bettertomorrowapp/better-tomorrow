name: Better Tomorrow Android Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Better Tomorrow project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'BetterTomorrow*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Better Tomorrow project ZIP not found"
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          rm -rf .build_source
          mkdir -p .build_source

          unzip -o "$ZIP_FILE" -d .build_source
          cp -a .build_source/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release AAB
        shell: bash
        run: |
          gradle --no-daemon clean bundleRelease

      - name: Verify AAB
        shell: bash
        run: |
          AAB=$(find app/build/outputs/bundle/release -type f -name "*.aab" -print -quit)

          if [ -z "$AAB" ]; then
            echo "ERROR: No AAB file was generated"
            exit 1
          fi

          echo "AAB successfully generated:"
          ls -lh "$AAB"

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/bundle/release/*.aab
          archive: false
          if-no-files-found: error
