name: Better Tomorrow Android Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract latest project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'BetterTomorrow_International_Live_V3.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "BetterTomorrow_International_Live_V3.zip not found"
            exit 1
          fi

          rm -rf .build_source
          mkdir -p .build_source
          unzip -o "$ZIP_FILE" -d .build_source
          cp -a .build_source/. .

      - name: Set Play Store Version Code
        shell: bash
        run: |
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 2/' app/build.gradle
          echo "Version Code set to 2"
          grep -n "versionCode" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release AAB
        run: |
          gradle --no-daemon clean bundleRelease

      - name: Decode upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_JSON: ${{ secrets.ANDROID_KEYSTORE_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_JSON" > signing.json

          KEYSTORE_BASE64=$(jq -r '.keystore_base64' signing.json)
          STORE_PASSWORD=$(jq -r '.store_password' signing.json)
          KEY_ALIAS=$(jq -r '.key_alias' signing.json)
          KEY_PASSWORD=$(jq -r '.key_password' signing.json)

          echo "$KEYSTORE_BASE64" | base64 --decode > android-upload-key.jks

          echo "store_password=$STORE_PASSWORD" >> signing.env
          echo "key_alias=$KEY_ALIAS" >> signing.env
          echo "key_password=$KEY_PASSWORD" >> signing.env

      - name: Sign release AAB
        shell: bash
        run: |
          source signing.env

          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          if [ -z "$AAB_FILE" ]; then
            echo "Release AAB not found"
            exit 1
          fi

          jarsigner \
            -keystore android-upload-key.jks \
            -storepass "$store_password" \
            -keypass "$key_password" \
            "$AAB_FILE" \
            "$key_alias"

      - name: Verify signed AAB
        shell: bash
        run: |
          source signing.env

          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          jarsigner -verify -verbose -certs \
            -keystore android-upload-key.jks \
            "$AAB_FILE"

          echo "SIGNED AAB VERIFIED"
          echo "VERSION CODE:"
          grep -n "versionCode" app/build.gradle

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-release-aab-v2
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
