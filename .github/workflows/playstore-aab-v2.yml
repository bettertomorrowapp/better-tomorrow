
name: Play Store AAB v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="BetterTomorrow_International_Live_V3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo "Files in repository:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Found source ZIP: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf .build_source
          mkdir -p .build_source

          unzip -q "BetterTomorrow_International_Live_V3.zip" -d .build_source

          PROJECT_DIR="$(dirname "$(find .build_source -type f -name settings.gradle -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore upload keystore
        shell: bash
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          set -e

          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then
            echo "ERROR: UPLOAD_KEYSTORE_B64 secret is empty or unavailable."
            exit 1
          fi

          printf '%s' "$UPLOAD_KEYSTORE_B64" \
            | base64 --decode \
            > "$PROJECT_DIR/upload-key.jks"

          if [ ! -s "$PROJECT_DIR/upload-key.jks" ]; then
            echo "ERROR: Keystore was not restored."
            exit 1
          fi

          echo "Upload keystore restored successfully."

      - name: Configure version 2 and signing
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # ------------------------------------------------------------
          # 1. Preserve the original project configuration.
          #    Only change versionCode from its existing value to 2.
          # ------------------------------------------------------------

          text, count = re.subn(
              r'(\bversionCode\s+)\d+',
              r'\g<1>2',
              text,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not find the existing versionCode in app/build.gradle"
              )

          # ------------------------------------------------------------
          # 2. Make sure the application ID remains correct.
          # ------------------------------------------------------------

          if not re.search(
              r"applicationId\s+['\"]com\.bettertomorrow\.app['\"]",
              text
          ):
              raise SystemExit(
                  "ERROR: applicationId com.bettertomorrow.app was not found."
              )

          # ------------------------------------------------------------
          # 3. Add release signing inside the existing Android project.
          #    Do NOT replace the original build.gradle file.
          # ------------------------------------------------------------

          signing_block = r'''
          
              signingConfigs {
                  release {
                      storeFile file("${rootDir}/upload-key.jks")
                      storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                      keyAlias "better-tomorrow-upload"
                      keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                  }
              }

          '''

          if "signingConfigs {" not in text:
              marker = re.search(
                  r'(\n\s*defaultConfig\s*\{)',
                  text
              )

              if not marker:
                  raise SystemExit(
                      "ERROR: Could not find defaultConfig block."
                  )

              text = (
                  text[:marker.start()]
                  + "\n"
                  + signing_block
                  + text[marker.start():]
              )

          # ------------------------------------------------------------
          # 4. Make release use the existing upload signing key.
          # ------------------------------------------------------------

          if "signingConfig signingConfigs.release" not in text:
              build_types = r'''
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }

              '''

              # Put buildTypes before the final closing brace of android.
              # This project has a simple Android block, so insert before
              # the final closing brace.
              pos = text.rfind("}")

              if pos == -1:
                  raise SystemExit(
                      "ERROR: Could not locate end of build.gradle."
                  )

              text = text[:pos] + build_types + text[pos:]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          # ------------------------------------------------------------
          # 5. Final safety checks before Gradle runs.
          # ------------------------------------------------------------

          with open(path, "r", encoding="utf-8") as f:
              final_text = f.read()

          if not re.search(r'\bversionCode\s+2\b', final_text):
              raise SystemExit(
                  "ERROR: versionCode 2 was not configured."
              )

          if not re.search(
              r"applicationId\s+['\"]com\.bettertomorrow\.app['\"]",
              final_text
          ):
              raise SystemExit(
                  "ERROR: Correct applicationId is missing."
              )

          if "signingConfigs" not in final_text:
              raise SystemExit(
                  "ERROR: signingConfigs was not added."
              )

          if "signingConfig signingConfigs.release" not in final_text:
              raise SystemExit(
                  "ERROR: release signing configuration is missing."
              )

          print("SUCCESS: Original project preserved.")
          print("SUCCESS: applicationId = com.bettertomorrow.app")
          print("SUCCESS: versionCode = 2")
          print("SUCCESS: release signing configured.")
          PY

          echo
          echo "===== FINAL app/build.gradle ====="
          cat "$APP_GRADLE"
          echo "=================================="

      

      - name: Build signed AAB
        shell: bash
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --no-daemon clean bundleRelease

      - name: Verify AAB exists
        shell: bash
        run: |
          set -e

          AAB="$(
            find "$PROJECT_DIR/app/build/outputs/bundle/release" \
              -type f \
              -name "*.aab" \
              -print -quit
          )"

          if [ -z "$AAB" ]; then
            echo "ERROR: No AAB was created."
            exit 1
          fi

          if [ ! -s "$AAB" ]; then
            echo "ERROR: AAB file is empty."
            exit 1
          fi

          echo "AAB created successfully:"
          ls -lh "$AAB"

          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: Verify actual AAB package and versionCode
        shell: bash
        run: |
          set -e

          curl -fsSL \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            -o bundletool.jar

          java -jar bundletool.jar dump manifest \
            --bundle "$AAB" \
            > manifest.txt

          echo "===== AAB MANIFEST CHECK ====="

          if ! grep -q 'com.bettertomorrow.app' manifest.txt; then
            echo "ERROR: AAB package is not com.bettertomorrow.app."
            cat manifest.txt
            exit 1
          fi

          if ! grep -Eq \
            'versionCode[^0-9]*2|android:versionCode="2"' \
            manifest.txt; then
            echo "ERROR: AAB does not contain versionCode 2."
            cat manifest.txt
            exit 1
          fi

          if grep -Eq \
            'android:versionCode="1"|versionCode[^0-9]*1' \
            manifest.txt; then
            echo "ERROR: AAB contains versionCode 1."
            cat manifest.txt
            exit 1
          fi

          echo "SUCCESS: Package = com.bettertomorrow.app"
          echo "SUCCESS: Actual AAB versionCode = 2"

      - name: Rename final AAB
        shell: bash
        run: |
          set -e

          FINAL_AAB="$PROJECT_DIR/app/build/outputs/bundle/release/BetterTomorrow-release-v2.aab"

          cp "$AAB" "$FINAL_AAB"

          if [ ! -s "$FINAL_AAB" ]; then
            echo "ERROR: Final AAB was not created."
            exit 1
          fi

          echo "Final AAB:"
          ls -lh "$FINAL_AAB"

          echo "FINAL_AAB=$FINAL_AAB" >> "$GITHUB_ENV"

      - name: Upload BetterTomorrow AAB v2
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-release-v2
          path: ${{ env.FINAL_AAB }}
          if-no-files-found: error
