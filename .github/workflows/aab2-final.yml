name: Better Tomorrow AAB 2 FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Better Tomorrow source
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'BetterTomorrow_International_Live_V3.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          rm -rf .build_source
          mkdir -p .build_source

          unzip -q "$ZIP_FILE" -d .build_source
          cp -a .build_source/. .

          test -f app/build.gradle

      - name: Set versionCode to 2
        shell: bash
        run: |
          set -e

          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 2/' app/build.gradle

          echo "Checking application settings:"
          grep -nE 'applicationId|versionCode|versionName' app/build.gradle

          grep -qE 'versionCode[[:space:]]+2' app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release AAB
        shell: bash
        run: |
          set -e

          gradle --no-daemon clean bundleRelease

          AAB_FILE="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"

          if [ -z "$AAB_FILE" ]; then
            echo "AAB was not created"
            exit 1
          fi

          echo "AAB created:"
          ls -lh "$AAB_FILE"

      - name: Decode upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_JSON: ${{ secrets.ANDROID_KEYSTORE_JSON }}
        run: |
          set -e

          python3 - <<'PY'
          import os
          import json
          import base64

          raw = os.environ.get("ANDROID_KEYSTORE_JSON", "")

          if not raw:
              raise SystemExit("ANDROID_KEYSTORE_JSON secret is empty")

          data = json.loads(raw)

          required = [
              "keystore_base64",
              "store_password",
              "key_alias",
              "key_password"
          ]

          for key in required:
              if not data.get(key):
                  raise SystemExit("Missing signing field: " + key)

          with open("android-upload-key.jks", "wb") as f:
              f.write(base64.b64decode(data["keystore_base64"]))

          with open("signing.env", "w") as f:
              f.write("STORE_PASSWORD=" + data["store_password"] + "\n")
              f.write("KEY_ALIAS=" + data["key_alias"] + "\n")
              f.write("KEY_PASSWORD=" + data["key_password"] + "\n")

          print("Signing configuration loaded successfully.")
          PY

          chmod 600 android-upload-key.jks
          chmod 600 signing.env

      - name: Sign release AAB
        shell: bash
        run: |
          set -e

          source signing.env

          AAB_FILE="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"

          if [ -z "$AAB_FILE" ]; then
            echo "Release AAB not found"
            exit 1
          fi

          jarsigner \
            -verbose \
            -keystore android-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

      - name: Verify signed AAB
        shell: bash
        run: |
          set -e

          AAB_FILE="$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"

          jarsigner -verify -verbose -certs "$AAB_FILE"

          echo "SIGNED AAB VERIFIED"

      - name: Verify versionCode 2
        shell: bash
        run: |
          set -e

          grep -qE 'versionCode[[:space:]]+2' app/build.gradle

         
