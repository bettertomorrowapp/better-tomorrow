name: Better Tomorrow AAB 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'BetterTomorrow_International_Live_V3.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          rm -rf .build_source
          mkdir -p .build_source
          unzip -o "$ZIP_FILE" -d .build_source
          cp -a .build_source/. .

      - name: Set versionCode to 2
        shell: bash
        run: |
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode 2/" app/build.gradle
          echo "Checking versionCode:"
          grep -n "versionCode" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release AAB
        shell: bash
        run: |
          gradle --no-daemon clean bundleRelease

      - name: Decode signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_JSON: ${{ secrets.ANDROID_KEYSTORE_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_JSON" > signing.json

          KEYSTORE_BASE64=$(jq -r '.keystore_base64' signing.json)
          STORE_PASSWORD=$(jq -r '.store_password' signing.json)
          KEY_ALIAS=$(jq -r '.key_alias' signing.json)
          KEY_PASSWORD=$(jq -r '.key_password' signing.json)

          echo "$KEYSTORE_BASE64" | base64 -d > android-upload-key.jks

          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          rm -f signing.json

      - name: Sign release AAB
        shell: bash
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          if [ -z "$AAB_FILE" ]; then
            echo "AAB not found"
            exit 1
          fi

          jarsigner \
            -verbose \
            -keystore android-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" \
            "$KEY_ALIAS"

      - name: Verify signed AAB
        shell: bash
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB_FILE"

          echo "SIGNED AAB VERIFIED"
          echo "VERSION CODE:"
          grep -n "versionCode" app/build.gradle

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-AAB-v2-SIGNED
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
