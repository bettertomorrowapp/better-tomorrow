name: Play Store AAB v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          test -f "BetterTomorrow_International_Live_V3.zip" || {
            echo "ERROR: BetterTomorrow_International_Live_V3.zip not found."
            exit 1
          }

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf .build_source
          mkdir -p .build_source
          unzip -q "BetterTomorrow_International_Live_V3.zip" -d .build_source

          PROJECT_DIR="$(dirname "$(find .build_source -type f -name settings.gradle -print -quit)")"

          test -n "$PROJECT_DIR" || {
            echo "ERROR: Android project settings.gradle not found."
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore upload keystore
        shell: bash
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_B64" || {
            echo "ERROR: UPLOAD_KEYSTORE_B64 secret is missing."
            exit 1
          }

          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$PROJECT_DIR/upload-key.jks"

          test -s "$PROJECT_DIR/upload-key.jks" || {
            echo "ERROR: Keystore file was not created."
            exit 1
          }

      - name: Configure version 2 and signing
        shell: bash
        run: |
          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bettertomorrow.app'
              compileSdk 36

              signingConfigs {
                  release {
                      storeFile file("${rootDir}/upload-key.jks")
                      storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                      keyAlias "better-tomorrow-upload"
                      keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                  }
              }

              defaultConfig {
                  applicationId 'com.bettertomorrow.app'
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName '1.1'
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Verify keystore password
        shell: bash
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          test -n "$UPLOAD_KEYSTORE_PASSWORD" || {
            echo "ERROR: UPLOAD_KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          keytool -list \
            -keystore "$PROJECT_DIR/upload-key.jks" \
            -storepass "$UPLOAD_KEYSTORE_PASSWORD" \
            -alias "better-tomorrow-upload" \
            > /dev/null

          echo "Keystore verified."

      - name: Build signed AAB
        shell: bash
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"

          gradle --no-daemon clean bundleRelease

      - name: Verify AAB and versionCode 2
        shell: bash
        run: |
          AAB="$(find "$PROJECT_DIR/app/build/outputs/bundle/release" \
            -type f -name '*.aab' -print -quit)"

          test -n "$AAB" || {
            echo "ERROR: No AAB was created."
            exit 1
          }

          echo "Created AAB:"
          ls -lh "$AAB"

          curl -fsSL \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            -o bundletool.jar

          java -jar bundletool.jar dump manifest \
            --bundle "$AAB" > manifest.txt

          echo "Checking versionCode..."

          grep -E 'versionCode[^0-9]*2|android:versionCode="2"' manifest.txt || {
            echo "ERROR: AAB does not contain versionCode 2."
            cat manifest.txt
            exit 1
          }

          echo "SUCCESS: versionCode 2 verified."

      - name: Upload BetterTomorrow AAB v2
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-release-v2
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
